<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" fill="none">
  <!-- Concept 3: Abstract geometric mark + Wordmark — An "O" formed by two overlapping arcs suggesting connectivity, data flow, partnership -->
  <defs>
    <linearGradient id="arc1" x1="0" y1="10" x2="40" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="arc2" x1="40" y1="10" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Two overlapping arcs forming a dynamic "O" / lens shape -->
  <!-- Left arc -->
  <path d="M22 6 A20 20 0 0 0 22 50" stroke="url(#arc1)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Right arc -->
  <path d="M22 6 A20 20 0 0 1 22 50" stroke="url(#arc2)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Data points along the arcs — suggest real-time tracking/connectivity -->
  <circle cx="5" cy="28" r="2" fill="#06B6D4"/>
  <circle cx="39" cy="28" r="2" fill="#22D3EE"/>
  <circle cx="22" cy="6" r="2.5" fill="#F1F5F9"/>
  <circle cx="22" cy="50" r="2.5" fill="#F1F5F9"/>

  <!-- Centre pulse — the platform core -->
  <circle cx="22" cy="28" r="3.5" fill="#06B6D4" opacity="0.3"/>
  <circle cx="22" cy="28" r="2" fill="#06B6D4"/>

  <!-- "Olaris" wordmark -->
  <text x="54" y="35" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#F1F5F9">Olaris</text>

  <!-- Tagline -->
  <text x="54" y="50" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" letter-spacing="3" fill="#94A3B8">FLEET INTELLIGENCE</text>
</svg>